name: listener
description: "Radio Listener Experience"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio & Background Playback
  just_audio: ^0.9.40
  audio_service: ^0.18.16
  rxdart: ^0.27.7

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  provider: ^6.0.5

  # Networking
  dio: ^5.7.0

  # Firebase / Real-time
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Utilities
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  connectivity_plus: ^5.0.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
