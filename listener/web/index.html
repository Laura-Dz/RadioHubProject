<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="RadioHub Listener Experience">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="listener">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RadioHub Listener</title>
  <link rel="manifest" href="manifest.json">

  <!-- Mobile In-Browser Debug Console (Eruda) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    if (window.eruda) {
      eruda.init();
      console.log('RadioHub mobile console initialized.');
    }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #ffffff;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600; color: #a0a0c0;">Loading RadioHub...</div>
  </div>

  <script>
    // Remove loading indicator once Flutter renders
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-indicator');
      if (loader) loader.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
